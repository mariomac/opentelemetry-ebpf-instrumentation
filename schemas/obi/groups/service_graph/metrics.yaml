groups:
  - id: metric.obi.traces_service_graph_endpoint
    type: metric
    metric_name: traces_service_graph_endpoint
    instrument: gauge
    unit: ""
    stability: development
    brief: >
      Mapping from a local service identity to a routable DNS name, with value 1.
      Independent of whether the service sends or receives requests.
    attributes:
      - ref: service.name
        requirement_level: required
      - ref: service.namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: route
        requirement_level: required
      - ref: source
        requirement_level: required

  # Counter has no explicit OTLP unit set; mirror that here so live-check
  # doesn't complain "Unit should be '1', but found ''".
  - id: metric.obi.traces_service_graph_request_total
    type: metric
    metric_name: traces_service_graph_request_total
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Total number of edges in the service graph, grouped by client / server.
    attributes:
      - ref: client
        requirement_level: required
      - ref: server
        requirement_level: required
      - ref: client.route
        requirement_level:
          conditionally_required: if the client has a DNS route but no service identity
      - ref: server.route
        requirement_level:
          conditionally_required: if the server has a DNS route but no service identity
      - ref: connection_type
        requirement_level:
          conditionally_required: if the connection was not a direct HTTP or gRPC request
      - ref: client_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: server_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: source
        requirement_level: required
      - ref: client_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: client_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled

  # Counter has no explicit OTLP unit set; mirror that here so live-check
  # doesn't complain "Unit should be '1', but found ''".
  - id: metric.obi.traces_service_graph_request_failed_total
    type: metric
    metric_name: traces_service_graph_request_failed_total
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Total number of failed edges in the service graph, grouped by
      client / server.
    attributes:
      - ref: client
        requirement_level: required
      - ref: server
        requirement_level: required
      - ref: client.route
        requirement_level:
          conditionally_required: if the client has a DNS route but no service identity
      - ref: server.route
        requirement_level:
          conditionally_required: if the server has a DNS route but no service identity
      - ref: connection_type
        requirement_level:
          conditionally_required: if the connection was not a direct HTTP or gRPC request
      - ref: client_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: server_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: source
        requirement_level: required
      - ref: client_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: client_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled

  - id: metric.obi.traces_service_graph_request_server
    type: metric
    metric_name: traces_service_graph_request_server
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Server-side request duration distribution per service-graph edge.
    attributes:
      - ref: client
        requirement_level: required
      - ref: server
        requirement_level: required
      - ref: client.route
        requirement_level:
          conditionally_required: if the client has a DNS route but no service identity
      - ref: server.route
        requirement_level:
          conditionally_required: if the server has a DNS route but no service identity
      - ref: connection_type
        requirement_level:
          conditionally_required: if the connection was not a direct HTTP or gRPC request
      - ref: client_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: server_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: source
        requirement_level: required
      - ref: client_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: client_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled

  - id: metric.obi.traces_service_graph_request_client
    type: metric
    metric_name: traces_service_graph_request_client
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Client-side request duration distribution per service-graph edge.
    attributes:
      - ref: client
        requirement_level: required
      - ref: server
        requirement_level: required
      - ref: client.route
        requirement_level:
          conditionally_required: if the client has a DNS route but no service identity
      - ref: server.route
        requirement_level:
          conditionally_required: if the server has a DNS route but no service identity
      - ref: connection_type
        requirement_level:
          conditionally_required: if the connection was not a direct HTTP or gRPC request
      - ref: client_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: server_service_namespace
        requirement_level:
          conditionally_required: if the workload has a namespace
      - ref: source
        requirement_level: required
      - ref: client_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_namespace_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: client_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: server_k8s_cluster_name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
